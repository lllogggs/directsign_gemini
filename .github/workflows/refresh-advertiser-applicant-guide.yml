name: Refresh advertiser applicant guide capture

on:
  push:
    paths:
      - ".github/workflows/refresh-advertiser-applicant-guide.yml"
      - "scripts/capture-current-applicant-guide.mjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current production applicant screen
        env:
          SALES_CAPTURE_BASE_URL: https://yeollock.me
        run: node scripts/capture-current-applicant-guide.mjs

      - name: Commit refreshed capture
        run: |
          if git diff --quiet -- public/guide/assets/yeollock-campaign-applicants-dashboard.png docs/sales/assets/yeollock-campaign-applicants-dashboard.png; then
            echo "Capture unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide/assets/yeollock-campaign-applicants-dashboard.png docs/sales/assets/yeollock-campaign-applicants-dashboard.png
          git commit -m "Refresh current campaign applicant guide capture"
          git push
