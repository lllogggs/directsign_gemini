name: Use current production guide screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-current-guide-screens.yml"

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point guide to production captures
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'public/guide/advertiser/index.html';
          let html = fs.readFileSync(p, 'utf8');

          const discovery = /<div class="discovery-shot">[\s\S]*?<\/div><\/section>\s*<section class="screen-section"><div class="screen-head"><div><div class="step">02 · RECRUIT<\/div>/;
          if (!discovery.test(html)) throw new Error('Discovery guide block not found');
          html = html.replace(
            discovery,
            '<div class="shot"><img src="/guide/assets/yeollock-influencer-discovery-main.png" alt="현재 연락미 인플루언서 탐색 화면" loading="lazy" /></div></section>\n      <section class="screen-section"><div class="screen-head"><div><div class="step">02 · RECRUIT</div>'
          );

          html = html.replace(
            '/guide/assets/yeollock-campaign-applicants-current.svg',
            '/guide/assets/yeollock-campaign-applicants-dashboard.png'
          );
          fs.writeFileSync(p, html);
          NODE
      - name: Commit guide screenshot update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide/advertiser/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use live production screenshots in advertiser guide"
          git push
