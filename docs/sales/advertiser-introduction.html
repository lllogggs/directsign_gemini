<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연락미 광고주 소개서</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 0;
      }

      @font-face {
        font-family: "NanumSquareNeo";
        font-weight: 400;
        src: url("../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-bRg.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "NanumSquareNeo";
        font-weight: 700;
        src: url("../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-cBd.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "NanumSquareNeo";
        font-weight: 900;
        src: url("../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-eHv.woff2")
          format("woff2");
      }

      :root {
        --ink: #111412;
        --muted: #58625c;
        --line: #dce4dd;
        --paper: #fbfaf7;
        --blue: #2563eb;
        --red: #e11d48;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e9ede8;
        color: var(--ink);
        font-family:
          "NanumSquareNeo", "Noto Sans KR", "Apple SD Gothic Neo",
          "Malgun Gothic", Arial, sans-serif;
        word-break: keep-all;
      }

      body {
        padding: 18px 0;
      }

      .deck {
        display: grid;
        gap: 18px;
        justify-content: center;
      }

      .page {
        position: relative;
        width: 297mm;
        height: 210mm;
        overflow: hidden;
        padding: 11mm 13mm 10mm;
        background:
          radial-gradient(circle at 78% 28%, rgba(37, 99, 235, 0.07), transparent 29%),
          linear-gradient(135deg, #fbfaf7 0%, #f4f6f2 100%);
        box-shadow: 0 22px 70px rgba(15, 23, 42, 0.14);
        page-break-after: always;
      }

      .page:last-child {
        page-break-after: auto;
      }

      .brand {
        position: absolute;
        top: 11mm;
        left: 13mm;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 900;
      }

      .brand-mark {
        display: inline-flex;
        width: 25px;
        height: 25px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 8px;
      }

      .brand-mark img {
        display: block;
        width: 25px;
        height: 25px;
      }

      .page-no {
        position: absolute;
        right: 13mm;
        bottom: 9mm;
        color: #88918b;
        font-size: 9px;
        font-weight: 700;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1.04;
      }

      .slide-content {
        display: grid;
        grid-template-columns: 73mm 1fr;
        gap: 10mm;
        align-items: start;
        height: 181mm;
        padding-top: 18mm;
      }

      .slide-copy {
        display: grid;
        align-content: start;
        min-height: 144mm;
        gap: 18px;
        padding: 32mm 0 0 8mm;
      }

      .slide-copy.compact-title h1 {
        font-size: 43px;
        line-height: 1.08;
      }

      .eyebrow {
        color: var(--red);
        font-size: 12px;
        font-weight: 900;
      }

      .pain-context {
        color: #2456d6;
        font-size: 28px;
        line-height: 1.08;
        font-weight: 900;
      }

      .support {
        color: var(--muted);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .support.blue {
        color: var(--blue);
      }

      .window {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 26px 72px rgba(15, 23, 42, 0.14);
      }

      .window-bar {
        display: flex;
        height: 9mm;
        align-items: center;
        gap: 5px;
        border-bottom: 1px solid var(--line);
        padding: 0 14px;
        background: #f7faf7;
      }

      .window-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c5cfc8;
      }

      .window img {
        display: block;
        width: 100%;
        height: 137mm;
        object-fit: contain;
        object-position: top center;
      }

      .product-window {
        height: 146mm;
      }

      .risk-panel {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        height: 146mm;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        padding: 12mm;
        box-shadow: 0 26px 72px rgba(15, 23, 42, 0.12);
      }

      .risk-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e1e7e2;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 34px rgba(15, 23, 42, 0.07);
      }

      .risk-card img {
        display: block;
        width: 100%;
        flex: 1;
        min-height: 0;
        height: auto;
        object-fit: cover;
        object-position: center;
      }

      .risk-caption {
        min-height: 22mm;
        padding: 8px 8px 9px;
      }

      .risk-caption span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
      }

      .risk-caption strong {
        display: block;
        margin-top: 3px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.15;
        letter-spacing: 0;
        font-weight: 900;
      }

      .cta {
        display: inline-flex;
        width: fit-content;
        margin-top: 6px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        padding: 15px 24px;
        font-size: 14px;
        font-weight: 900;
        box-shadow: 0 18px 42px rgba(37, 99, 235, 0.22);
      }

      @media print {
        html,
        body {
          width: 297mm;
          min-height: 0;
          background: #fff;
        }

        body {
          padding: 0;
        }

        .deck {
          display: block;
          gap: 0;
        }

        .page {
          box-shadow: none;
          break-after: page;
          page-break-after: always;
        }

        .page:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="deck">
      <section class="page" data-stage="pain-point">
        <div class="brand">
          <span class="brand-mark"><img src="../../public/favicon.svg" alt="" /></span>
          연락미
        </div>
        <div class="slide-content">
          <div class="slide-copy compact-title">
            <p class="pain-context">인플루언서<br />광고 계약</p>
            <h1>계약서<br />없는 약속은<br />위험합니다.</h1>
          </div>
          <div class="risk-panel" aria-label="계약서 없이 생길 수 있는 리스크 사례">
            <article class="risk-card">
              <img src="assets/risk-generated-missed-contact.png" alt="광고비 선지급 후 연락이 닿지 않는 상황" />
              <p class="risk-caption"><span>사례 1</span><strong>광고비 먹튀</strong></p>
            </article>
            <article class="risk-card">
              <img src="assets/risk-generated-product-held.png" alt="협찬 제품을 품에 안고 반환을 꺼리는 상황" />
              <p class="risk-caption"><span>사례 2</span><strong>협찬품 미반환</strong></p>
            </article>
            <article class="risk-card">
              <img src="assets/risk-generated-revision-refusal.png" alt="콘텐츠 수정 요청이 거부되는 상황" />
              <p class="risk-caption"><span>사례 3</span><strong>콘텐츠 수정 거부</strong></p>
            </article>
            <article class="risk-card">
              <img src="assets/risk-generated-general-dispute.png" alt="계약 조건이 불분명해 양측이 분쟁 중인 상황" />
              <p class="risk-caption"><span>사례 4</span><strong>각종 분쟁</strong></p>
            </article>
          </div>
        </div>
      </section>

      <section class="page" data-stage="strength">
        <div class="brand">
          <span class="brand-mark"><img src="../../public/favicon.svg" alt="" /></span>
          연락미
        </div>
        <div class="slide-content">
          <div class="slide-copy">
            <p class="eyebrow">계약화</p>
            <h1>계약서를<br />씁니다</h1>
            <p class="support blue">조건 · 기한 · 산출물</p>
          </div>
          <div class="window product-window">
            <div class="window-bar">
              <span class="window-dot"></span>
              <span class="window-dot"></span>
              <span class="window-dot"></span>
            </div>
            <img src="assets/yeollock-contract-builder.png" alt="연락미 계약 작성 화면" />
          </div>
        </div>
        <span class="page-no">02</span>
      </section>

      <section class="page" data-stage="service-explanation">
        <div class="brand">
          <span class="brand-mark"><img src="../../public/favicon.svg" alt="" /></span>
          연락미
        </div>
        <div class="slide-content">
          <div class="slide-copy">
            <p class="eyebrow">진행 증빙</p>
            <h1>이행을<br />확인합니다</h1>
            <p class="support">서명 · 제출 · 검수</p>
          </div>
          <div class="window product-window">
            <div class="window-bar">
              <span class="window-dot"></span>
              <span class="window-dot"></span>
              <span class="window-dot"></span>
            </div>
            <img src="assets/yeollock-advertiser-dashboard.png" alt="연락미 계약 대시보드" />
          </div>
        </div>
        <span class="page-no">03</span>
      </section>

      <section class="page" data-stage="service-explanation">
        <div class="brand">
          <span class="brand-mark"><img src="../../public/favicon.svg" alt="" /></span>
          연락미
        </div>
        <div class="slide-content">
          <div class="slide-copy">
            <p class="eyebrow">모집 계약</p>
            <h1>선정 전<br />확인합니다</h1>
            <p class="support">프로필 · 채널 · 조건</p>
          </div>
          <div class="window product-window">
            <div class="window-bar">
              <span class="window-dot"></span>
              <span class="window-dot"></span>
              <span class="window-dot"></span>
            </div>
            <img src="assets/yeollock-campaign-builder-main.png" alt="연락미 캠페인 지원자 확인 화면" />
          </div>
        </div>
        <span class="page-no">04</span>
      </section>

      <section class="page" data-stage="cta">
        <div class="brand">
          <span class="brand-mark"><img src="../../public/favicon.svg" alt="" /></span>
          연락미
        </div>
        <div class="slide-content">
          <div class="slide-copy">
            <p class="eyebrow">다음 광고</p>
            <h1>말 대신<br />계약으로</h1>
            <p class="support">광고 계약은 확실하게</p>
            <span class="cta">yeollock.me</span>
          </div>
          <div class="window product-window">
            <div class="window-bar">
              <span class="window-dot"></span>
              <span class="window-dot"></span>
              <span class="window-dot"></span>
            </div>
            <img src="assets/yeollock-advertiser-dashboard.png" alt="연락미 계약 대시보드 요약" />
          </div>
        </div>
        <span class="page-no">05</span>
      </section>
    </main>
  </body>
</html>
